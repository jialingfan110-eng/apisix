worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/mock.pid;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        location / {
            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if not body and ngx.req.get_body_file() then
                    local file = assert(io.open(ngx.req.get_body_file(), "rb"))
                    body = file:read("*a"); file:close()
                end
                local h = ngx.req.get_headers()
                ngx.header["Content-Type"] = "application/json"
                if ngx.var.uri == "/api/v1/raw" then
                    ngx.status = 418; ngx.print("raw\0body\255"); return
                end
                if ngx.var.uri == "/api/v1/failure" then ngx.status = 503 end
                ngx.print(require("cjson").encode({
                    method=ngx.req.get_method(), uri=ngx.var.request_uri,
                    body_base64=ngx.encode_base64(body or ""),
                    fake_authorization_ok=h.authorization == "Bearer acceptance-only-fake-token",
                    apikey_absent=h.apikey == nil,
                    consumer_header_absent=h["x-consumer-username"] == nil,
                    content_type=h["content-type"] or "", host=h.host
                }))
            }
        }
    }
}

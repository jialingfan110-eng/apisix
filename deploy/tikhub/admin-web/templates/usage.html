{% extends "base.html" %}{% block content %}<h1>今日用量</h1><p>{{ day }}（北京时间 00:00 至次日 00:00），按请求 ID 去重。</p><section class="card">{% for c in consumers %}<div class="usage-row"><div><strong>{{ c.display_name }}</strong><span class="muted"> {{ c.username }}</span></div><progress max="{{ maximum }}" value="{{ c.calls }}">{{ c.calls }}</progress><span>{{ c.calls }} 次</span></div>{% else %}<p>今日暂无调用记录。</p>{% endfor %}</section><p class="muted">日志异步写入，可能延迟数秒；极端故障可能少量丢失。</p>{% endblock %}

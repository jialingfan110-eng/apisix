{% extends "base.html" %}{% block scripts %}<script defer src="/static/result.js"></script>{% endblock %}{% block content %}<section class="card"><h1>Key 已创建</h1><p>员工：{{ result.display_name }} · 内部账号：<code>{{ result.username }}</code></p><p class="notice">请现在复制保存。此完整 key 只展示一次，刷新或返回后不会再次显示。</p><label>完整子 key<textarea data-one-time-key readonly rows="3" aria-label="完整子 key" spellcheck="false">{{ result.key }}</textarea></label><a class="button" href="/">已保存，返回列表</a></section>{% endblock %}
